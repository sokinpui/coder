name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build and Package Binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )
          BINARIES=("coder" "itf" "sf" "pcat" "pti")

          mkdir -p dist

          for platform in "${PLATFORMS[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            ARCHIVE_DIR="coder_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "$ARCHIVE_DIR"

            for bin in "${BINARIES[@]}"; do
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
                -ldflags="-s -w -X github.com/sokinpui/coder/pkg/version.Version=${VERSION}" \
                -o "${ARCHIVE_DIR}/${bin}${EXT}" \
                "./cmd/${bin}"
            done

            if [ -f README.md ]; then
              cp README.md "$ARCHIVE_DIR/"
            fi

            if [ "$GOOS" = "windows" ]; then
              zip -r "dist/${ARCHIVE_DIR}.zip" "$ARCHIVE_DIR"
            else
              tar -czf "dist/${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
            fi

            rm -rf "$ARCHIVE_DIR"
          done

          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
