<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 18" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- 第一层：最外层浅色外框 (长方形外轮廓) -->
  <rect x="3" y="1" width="18" height="16" fill="#334155" />
  <rect x="2" y="2" width="20" height="14" fill="#334155" />
  <rect x="1" y="3" width="22" height="12" fill="#334155" />

  <!-- 第二层：内层深色外框 (1像素过渡框) -->
  <rect x="3" y="2" width="18" height="14" fill="#1E293B" />
  <rect x="2" y="3" width="20" height="12" fill="#1E293B" />

  <!-- CRT 屏幕主体 (横向长方形黑屏) -->
  <rect x="3" y="3" width="18" height="12" fill="#020617" />

  <!-- 荧光绿像素眼睛 -->
  <!-- 左眼 -->
  <rect x="7" y="5" width="3" height="4" fill="#34D399" />

  <!-- 右眼 -->
  <rect x="14" y="5" width="3" height="4" fill="#34D399" />

  <!-- 嘴巴 -->
  <rect x="9" y="11" width="2" height="1" fill="#34D399" />
  <rect x="13" y="11" width="2" height="1" fill="#34D399" />
  <rect x="11" y="12" width="2" height="1" fill="#34D399" />
</svg>
